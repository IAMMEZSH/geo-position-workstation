<rect width="1180" height="920" fill="url(#hudbg)"/>
<rect width="1180" height="920" fill="url(#hudgrid)"/>
<rect width="1180" height="920" fill="url(#hudscan)"/>
<rect width="1180" height="920" fill="url(#hudbloom)"/>
<rect x="14" y="14" width="1152" height="892" rx="3" fill="none" stroke="#1d3a53"/>
<path d="M14 44V14h30M1136 14h30v30M1166 876v30h-30M44 906H14v-30" fill="none" stroke="#3b8fc4" stroke-width="2"/>
<text x="48" y="58" font-size="11.5" fill="#59d6ff" font-weight="600" text-anchor="start" letter-spacing="3.2">PACKAGING</text>
<text x="48" y="92" font-size="27" fill="#f3d27a" font-weight="700" text-anchor="start" letter-spacing="0.6">ONE APPLICATION, SIX PACKS</text>
<text x="48" y="118" font-size="13.5" fill="#8ea9bf" font-weight="400" text-anchor="start">Explicit manifests, no wildcards: a file cannot ride along just because it sits in the folder.</text>
<rect x="48" y="140" width="1084" height="92" rx="8" fill="#0c1727" stroke="#24455f"/>
<rect x="48" y="140" width="3.5" height="92" rx="1.7" fill="#59d6ff"/>
<text x="66" y="167" font-size="13" fill="#59d6ff" font-weight="600" text-anchor="start" letter-spacing="1.5">EVERY PACK CARRIES THE SHARED CORE</text>
<text x="66" y="192" font-size="12" fill="#7f97ad" font-weight="400" text-anchor="start">index.html · nine app/*.js · three app/data/*.js (2.86 MB) · three vendor/ files · ten samples · LICENSE · README · MANUAL · five SVG figures</text>
<text x="66" y="210" font-size="12" fill="#7f97ad" font-weight="400" text-anchor="start">The core runs all eleven panels. Everything else on this sheet is a launcher, a bridge, or a developer file.</text><rect x="48" y="252" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="48" y="252" width="3.5" height="142" fill="#59d6ff"/><text x="66" y="280" font-size="14" fill="#59d6ff" font-weight="700" text-anchor="start" letter-spacing="1.4">BROWSER</text><text x="378" y="280" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">36 files</text><text x="66" y="308" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">index.html only — no bridge</text><text x="66" y="378" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 590 364 B</text><rect x="416" y="252" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="416" y="252" width="3.5" height="142" fill="#f3d27a"/><text x="434" y="280" font-size="14" fill="#f3d27a" font-weight="700" text-anchor="start" letter-spacing="1.4">WINDOWS</text><text x="746" y="280" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">39 files</text><text x="434" y="308" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">+ 开动-Windows.bat, bridge-powershell.ps1, server.py</text><text x="434" y="378" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 879 447 B</text><rect x="784" y="252" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="784" y="252" width="3.5" height="142" fill="#6fe3b0"/><text x="802" y="280" font-size="14" fill="#6fe3b0" font-weight="700" text-anchor="start" letter-spacing="1.4">macOS</text><text x="1114" y="280" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">39 files</text><text x="802" y="308" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">+ 开动-macOS.command, shared .sh, server.py</text><text x="802" y="378" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 748 973 B</text><rect x="48" y="410" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="48" y="410" width="3.5" height="142" fill="#b8a6ff"/><text x="66" y="438" font-size="14" fill="#b8a6ff" font-weight="700" text-anchor="start" letter-spacing="1.4">LINUX</text><text x="378" y="438" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">39 files</text><text x="66" y="466" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">+ 开动-Linux.sh, shared .sh, server.py</text><text x="66" y="536" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 752 268 B</text><rect x="416" y="410" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="416" y="410" width="3.5" height="142" fill="#ff9a94"/><text x="434" y="438" font-size="14" fill="#ff9a94" font-weight="700" text-anchor="start" letter-spacing="1.4">ANDROID</text><text x="746" y="438" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">38 files</text><text x="434" y="466" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">+ 开动-Android.sh, server.py</text><text x="434" y="536" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 735 359 B</text><rect x="784" y="410" width="348" height="142" rx="8" fill="#0c1727" stroke="#24455f"/><rect x="784" y="410" width="3.5" height="142" fill="#59d6ff"/><text x="802" y="438" font-size="14" fill="#59d6ff" font-weight="700" text-anchor="start" letter-spacing="1.4">iOS · iSH</text><text x="1114" y="438" font-size="12" fill="#7f97ad" font-weight="600" text-anchor="end">38 files</text><text x="802" y="466" font-size="11.5" fill="#a9bdd0" font-weight="400" text-anchor="start">+ 开动-iSH.sh, server.py</text><text x="802" y="536" font-size="12" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">4 745 470 B</text><rect x="48" y="580" width="520" height="160" rx="8" fill="#0c1727" stroke="#24455f"/>
<rect x="48" y="580" width="3.5" height="160" rx="1.7" fill="#ff9a94"/>
<text x="66" y="607" font-size="13" fill="#ff9a94" font-weight="600" text-anchor="start" letter-spacing="1.5">LEFT OUT OF PLATFORM PACKS</text>
<text x="66" y="632" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">tests/ · 工具/build-data.mjs · package.json</text>
<text x="66" y="651" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">.github/ · .gitattributes · .gitignore · images/*.png</text>
<text x="66" y="670" font-size="12" fill="#7f97ad" font-weight="400" text-anchor="start">Developer surface only. Nothing in the running application reads it.</text>
<text x="66" y="688" font-size="12" fill="#7f97ad" font-weight="400" text-anchor="start">geo-full.zip keeps everything: 68 files, 7 656 156 B.</text><rect x="612" y="580" width="520" height="160" rx="8" fill="#0c1727" stroke="#24455f"/>
<rect x="612" y="580" width="3.5" height="160" rx="1.7" fill="#6fe3b0"/>
<text x="630" y="607" font-size="13" fill="#6fe3b0" font-weight="600" text-anchor="start" letter-spacing="1.5">BUILD AND VERIFY A PACK</text>
<text x="630" y="632" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">python 工具/pack-platform.py --list</text>
<text x="630" y="651" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">python 工具/pack-platform.py --check</text>
<text x="630" y="670" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">python 工具/pack-platform.py macos</text>
<text x="630" y="689" font-size="12.5" fill="#8fe3ff" font-weight="400" text-anchor="start" font-family="Consolas, Menlo, monospace">python 工具/pack-platform.py --all --json dist/包清单.json</text><rect x="48" y="756" width="1084" height="68" rx="8" fill="#0c1727" stroke="#24455f"/>
<rect x="48" y="756" width="3.5" height="68" rx="1.7" fill="#f3d27a"/>
<text x="66" y="783" font-size="13" fill="#f3d27a" font-weight="600" text-anchor="start" letter-spacing="1.5">WHY THE NUMBERS HOLD</text>
<text x="66" y="808" font-size="12" fill="#7f97ad" font-weight="400" text-anchor="start">ZIP timestamps are pinned to 1980-01-01 and launchers are stored with mode 0755, so an identical tree repacks to identical bytes.</text><text x="48" y="894" font-size="10.5" fill="#5e7890" font-weight="600" text-anchor="start" letter-spacing="2.2">GEO POSITION WORKSTATION</text><text x="1132" y="894" font-size="10.5" fill="#5e7890" font-weight="600" text-anchor="end" letter-spacing="2.2">MECHANISM DIAGRAM</text></svg>