<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="hudbg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0c1626"/>
      <stop offset="0.45" stop-color="#070d18"/>
      <stop offset="1" stop-color="#03060c"/>
    </linearGradient>
    <radialGradient id="hudbloom" cx="0.16" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hudgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#2dd4bf" stroke-opacity="0.085" stroke-width="1"/>
    </pattern>
    <pattern id="hudscan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H4" fill="none" stroke="#8ab4ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="hudglow" x="-25%" y="-70%" width="150%" height="240%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hudlift" x="-14%" y="-14%" width="128%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.4" flood-color="#000000" flood-opacity="0.72"/>
    </filter>
  </defs>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa8c2"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="860" fill="url(#hudbg)"/>
  <rect x="0" y="0" width="1180" height="860" fill="url(#hudgrid)"/>
  <rect x="0" y="0" width="1180" height="860" fill="url(#hudscan)"/>
  <rect x="0" y="0" width="1180" height="860" fill="url(#hudbloom)"/>
  <g stroke="#22d3ee" stroke-opacity="0.65" stroke-width="2" fill="none">
    <path d="M12 32V12h20"/>
    <path d="M1148 12h20v20"/>
    <path d="M1168 828v20h-20"/>
    <path d="M32 848H12v-20"/>
  </g>
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#dbe9fb" filter="url(#hudglow)">Geo Position Workstation · layered architecture</text>
  <text x="40" y="72" font-size="14" fill="#a2b5cb">Solid line = call inside the machine · orange dashed = the only two ways out (panel ⑧ through the bridge, optional map tiles)</text>

  <!-- Browser -->
  <rect x="40" y="92" width="1100" height="72" rx="10" fill="#111c2a" stroke="#dbe9fb" stroke-width="2" filter="url(#hudlift)"/>
  <text x="60" y="122" font-size="16" font-weight="bold" fill="#dbe9fb" filter="url(#hudglow)">Browser (the only runtime)</text>
  <text x="60" y="146" font-size="12" fill="#a2b5cb">Two equivalent entries: double-click index.html (file://, Origin=null), or open http://127.0.0.1:8765/index.html with the bridge running (loopback = secure context, so geolocation works)</text>

  <!-- UI layer -->
  <rect x="40" y="184" width="1100" height="118" rx="10" fill="#0c1728" stroke="#6fd3ff" stroke-width="2" filter="url(#hudlift)"/>
  <text x="60" y="212" font-size="16" font-weight="bold" fill="#55c8ff" filter="url(#hudglow)">UI layer · computes nothing</text>
  <rect x="60" y="226" width="330" height="60" rx="6" fill="#111c2a" stroke="#9adfff" filter="url(#hudlift)"/>
  <text x="76" y="250" font-size="13" font-weight="bold" fill="#55c8ff" filter="url(#hudglow)">app/ui-app.js</text>
  <text x="76" y="270" font-size="12" fill="#a2b5cb">11 panels · session table · deep link / QR · theme</text>
  <rect x="410" y="226" width="330" height="60" rx="6" fill="#111c2a" stroke="#9adfff" filter="url(#hudlift)"/>
  <text x="426" y="250" font-size="13" font-weight="bold" fill="#55c8ff" filter="url(#hudglow)">app/ui-map.js</text>
  <text x="426" y="270" font-size="12" fill="#a2b5cb">Leaflet wrapper · centre crosshair · land vector</text>
  <rect x="760" y="226" width="360" height="60" rx="6" fill="#111c2a" stroke="#9adfff" filter="url(#hudlift)"/>
  <text x="776" y="250" font-size="13" font-weight="bold" fill="#55c8ff" filter="url(#hudglow)">Exactly three jobs</text>
  <text x="776" y="270" font-size="12" fill="#a2b5cb">input → kernel call → draw; never computes a number</text>

  <!-- Kernels -->
  <rect x="40" y="322" width="1100" height="214" rx="10" fill="#0b1a13" stroke="#4bf2a2" stroke-width="2" filter="url(#hudlift)"/>
  <text x="60" y="350" font-size="16" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">Seven kernels · each with its own re-runnable selfTest() · six are pure, GEOVAULT owns the encrypted store</text>

  <g font-size="12">
    <rect x="60" y="364" width="255" height="76" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="74" y="386" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEOGEO · core-geodetic.js</text>
    <text x="74" y="406" fill="#7ff0bb">Ellipsoid · geodesic fwd/inv · Bursa 7</text>
    <text x="74" y="422" fill="#7ff0bb">ECEF / ENU · convex hull area · azimuth</text>

    <rect x="330" y="364" width="255" height="76" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="344" y="386" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEODATUM · core-datums.js</text>
    <text x="344" y="406" fill="#7ff0bb">DMS/UTM/UPS/MGRS/Geohash/Plus Code</text>
    <text x="344" y="422" fill="#7ff0bb">Projection fwd/inv · GCJ-02 / BD-09</text>

    <rect x="600" y="364" width="255" height="76" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="614" y="386" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEOCELL · core-cell.js</text>
    <text x="614" y="406" fill="#7ff0bb">GSM/WCDMA/LTE/NR ARFCN→frequency</text>
    <text x="614" y="422" fill="#7ff0bb">TA/RSRP range · lateration · fingerprint</text>

    <rect x="870" y="364" width="250" height="76" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="884" y="386" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEOGNSS · core-gnss.js</text>
    <text x="884" y="406" fill="#7ff0bb">NMEA · Kepler orbits · weighted LSQ PVT</text>
    <text x="884" y="422" fill="#7ff0bb">DOP · RAIM/FDE · tropo/iono · L6/B2b</text>

    <rect x="60" y="452" width="255" height="70" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="74" y="474" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEOASTRO · core-astro.js</text>
    <text x="74" y="494" fill="#7ff0bb">Sun / moon / star apparent place · SSP</text>
    <text x="74" y="510" fill="#7ff0bb">Terminator · Polaris compass · lat from alt</text>

    <rect x="330" y="452" width="255" height="70" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="344" y="474" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEONET · core-net.js</text>
    <text x="344" y="494" fill="#7ff0bb">Request audit · multi-source fusion (BLUE)</text>
    <text x="344" y="510" fill="#7ff0bb">traceroute parsing · offline unless allowed</text>

    <rect x="600" y="452" width="255" height="70" rx="6" fill="#111c2a" stroke="#9ff5c8" filter="url(#hudlift)"/>
    <text x="614" y="474" font-size="13" font-weight="bold" fill="#34e88c" filter="url(#hudglow)">GEOVAULT · core-vault.js</text>
    <text x="614" y="494" fill="#7ff0bb">AES-256-GCM · PBKDF2-SHA256 ≥ 250k</text>
    <text x="614" y="510" fill="#7ff0bb">one disk key · auto-lock · wipe</text>

    <rect x="870" y="452" width="250" height="70" rx="6" fill="#1c1608" stroke="#f2d488" filter="url(#hudlift)"/>
    <text x="884" y="474" font-size="13" font-weight="bold" fill="#f5c74d" filter="url(#hudglow)">Gates measured in one run</text>
    <text x="884" y="494" fill="#e3c987">623 / 0 in 1.49 s (⑪ and Node)</text>
    <text x="884" y="510" fill="#e3c987">Py 110(+1) · PS 202 · parity 41</text>
  </g>

  <!-- Data -->
  <rect x="40" y="556" width="1100" height="112" rx="10" fill="#170f22" stroke="#c084fc" stroke-width="2" filter="url(#hudlift)"/>
  <text x="60" y="584" font-size="16" font-weight="bold" fill="#b983ff" filter="url(#hudglow)">Offline data and third-party code (all shipped in the package, nothing downloaded)</text>
  <g font-size="12">
    <rect x="60" y="596" width="250" height="56" rx="6" fill="#111c2a" stroke="#ddc3ff" filter="url(#hudlift)"/>
    <text x="74" y="616" font-size="13" font-weight="bold" fill="#b983ff" filter="url(#hudglow)">data-cities.js · 2.08 MB</text>
    <text x="74" y="636" fill="#cdb8f0">GeoNames cities15000 (CC BY 4.0)</text>

    <rect x="325" y="596" width="250" height="56" rx="6" fill="#111c2a" stroke="#ddc3ff" filter="url(#hudlift)"/>
    <text x="339" y="616" font-size="13" font-weight="bold" fill="#b983ff" filter="url(#hudglow)">data-land.js · 763 KB</text>
    <text x="339" y="636" fill="#cdb8f0">Natural Earth 50m land · 1374 rings</text>

    <rect x="590" y="596" width="250" height="56" rx="6" fill="#111c2a" stroke="#ddc3ff" filter="url(#hudlift)"/>
    <text x="604" y="616" font-size="13" font-weight="bold" fill="#b983ff" filter="url(#hudglow)">data-countries.js · 9.4 KB</text>
    <text x="604" y="636" fill="#cdb8f0">ISO 3166-1 alpha-2 → names</text>

    <rect x="855" y="596" width="265" height="56" rx="6" fill="#111c2a" stroke="#ddc3ff" filter="url(#hudlift)"/>
    <text x="869" y="616" font-size="13" font-weight="bold" fill="#b983ff" filter="url(#hudglow)">vendor/</text>
    <text x="869" y="636" fill="#cdb8f0">Leaflet 1.9.4 (BSD-2) · qrcode.js (MIT)</text>
  </g>

  <!-- Bridge -->
  <rect x="40" y="688" width="1100" height="132" rx="10" fill="#1e120c" stroke="#ff9f6e" stroke-width="2" filter="url(#hudlift)"/>
  <text x="60" y="716" font-size="16" font-weight="bold" fill="#ff875c" filter="url(#hudglow)">Local bridge (optional, binds 127.0.0.1 only): two implementations, one /api contract</text>
  <g font-size="12">
    <rect x="60" y="728" width="330" height="76" rx="6" fill="#111c2a" stroke="#ffc8ab" filter="url(#hudlift)"/>
    <text x="74" y="748" font-size="13" font-weight="bold" fill="#ff875c" filter="url(#hudglow)">Interchangeable; the page cannot tell which</text>
    <text x="74" y="766" fill="#ffb998">server.py: Python standard library only</text>
    <text x="74" y="784" fill="#ffb998">bridge-powershell.ps1: PS 5.1 on Windows, zero install</text>

    <rect x="405" y="728" width="330" height="76" rx="6" fill="#111c2a" stroke="#ffc8ab" filter="url(#hudlift)"/>
    <text x="419" y="748" font-size="13" font-weight="bold" fill="#ff875c" filter="url(#hudglow)">External input → whitelist → argv array</text>
    <text x="419" y="766" fill="#ffb998">Python: argv list + subprocess(shell=False)</text>
    <text x="419" y="784" fill="#ffb998">PowerShell: argument array + UseShellExecute=$false</text>

    <rect x="750" y="728" width="370" height="76" rx="6" fill="#111c2a" stroke="#ffc8ab" filter="url(#hudlift)"/>
    <text x="764" y="748" font-size="13" font-weight="bold" fill="#ff875c" filter="url(#hudglow)">Refuses instead of warning (same red lines)</text>
    <text x="764" y="766" fill="#ffb998">Non-loopback bind rejected; every request re-checked</text>
    <text x="764" y="784" fill="#ffb998">Busy port → no second listener; unparsed route → 0 hops</text>
  </g>

  <!-- Edges -->
  <path d="M590,164 L590,184" stroke="#8fa8c2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590,302 L590,322" stroke="#8fa8c2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M590,536 L590,556" stroke="#8fa8c2" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M200,668 L200,688" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a2)"/>
  <text x="212" y="682" font-size="12" fill="#f5c74d">Panel ⑧ reaches here only after you allow outbound traffic</text>

  <path d="M900,688 C900,640 1010,600 1010,536" stroke="#fbbf24" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#a2)"/>
  <text x="998" y="550" font-size="12" fill="#f5c74d" text-anchor="end">Online map tiles (optional, mutually exclusive with vector)</text>

  <text x="40" y="846" font-size="12" fill="#a2b5cb">How to read: kernels never depend on the UI · GEONET sends only after panel ⑧'s explicit allow · with neither bridge running, the other 10 panels behave identically.</text>
</svg>
